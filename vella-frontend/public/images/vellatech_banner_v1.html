/* ── Contenido principal ── */
.content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  opacity: 0;
  animation: contentIn 1.1s ease 2.5s forwards;
}
@keyframes contentIn {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Logo imagen real ── */
.logo-img {
  width: 520px;
  max-width: 90vw;
  height: auto;
  display: block;
  margin-bottom: 6px;
}

/* Shimmer dorado */
.shimmer-bar {
  width: 0;
  height: 1.5px;
  background: linear-gradient(90deg, transparent, #C9A84C, transparent);
  margin: 10px 0 20px;
  border-radius: 2px;
  animation: expandBar 1s ease 3.1s forwards;
}
@keyframes expandBar { to { width: 260px; } }

.tagline {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 22px;
  color: #8B1A3A;
  letter-spacing: 0.5px;
  margin-bottom: 10px;
}
.sub {
  font-family: 'Lato', sans-serif;
  font-weight: 300;
  font-size: 14px;
  color: #2C3E6B;
  text-align: center;
  max-width: 390px;
  line-height: 1.7;
}

/* ── Partículas estrella ── */
.star-p {
  position: absolute;
  pointer-events: none;
  opacity: 0;
  animation: starFloat linear infinite;
}
@keyframes starFloat {
  0%   { opacity: 0;   transform: translateY(0)     scale(0.4) rotate(0deg); }
  15%  { opacity: 0.9; }
  80%  { opacity: 0.6; }
  100% { opacity: 0;   transform: translateY(-100px) scale(1.4) rotate(45deg); }
}
</style>

<script>
(function() {
  const banner = document.getElementById('banner');
  const colors = ['#C9A84C','#D4A060','#8B1A3A','#E8C97A','#C9A84C','#b5883a'];

  function makeStar(x, bottom, delay, dur, size, color) {
    const d = document.createElement('div');
    d.className = 'star-p';
    d.style.cssText = `left:${x}%;bottom:${bottom}%;animation-duration:${dur}s;animation-delay:${delay}s;`;
    d.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 20 20">
      <path d="M10 0L11.9 8.1L20 10L11.9 11.9L10 20L8.1 11.9L0 10L8.1 8.1Z" fill="${color}"/>
    </svg>`;
    banner.appendChild(d);
  }

  for (let i = 0; i < 28; i++) {
    makeStar(
      5  + Math.random() * 90,
      4  + Math.random() * 40,
      Math.random() * 5.5,
      2.8 + Math.random() * 3.5,
      6  + Math.random() * 10,
      colors[Math.floor(Math.random() * colors.length)]
    );
  }
})();
</script>
